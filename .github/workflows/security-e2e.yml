name: Security E2E

# ---------------------------------------------------------------------------
# Security E2E tests run OWASP-style penetration tests against a live
# Express backend. They are NOT part of the default CI because they need:
#   - A running backend (port 3001)
#   - A seeded database (requires superadmin@demo.com / admin@demo.com / user@demo.com)
#   - Redis for rate-limiting middleware
#
# Triggers:
#   - workflow_dispatch:     manual run from the Actions tab
#   - schedule (nightly):    Phase F of the audit PRP — re-enabled once the
#                            in-memory RBAC matrix (Phase B) and Server Action
#                            unit suite (Phase C) gave us a green baseline.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC = 10:00 ICT (Thailand). Runs daily and posts results to the
    # Actions tab; failures are tracked manually for the first 7 nights, after
    # which the audit PRP marks Phase F's exit criterion satisfied.
    - cron: '0 3 * * *'

concurrency:
  group: security-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security · OWASP E2E suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      # Redis is required by the rate-limiting middleware (express-rate-limit +
      # ioredis). Without Redis, the rate-limiter falls back to in-memory which
      # breaks several brute-force tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrims
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      # Dev-only CI credentials for the MySQL 8 service container.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hrims
      # Backend must listen on 3001 to match securityConfig.targets.backend
      PORT: '3001'
      TEST_BACKEND_URL: http://localhost:3001
      # Must match the default in backend/src/tests/security/config.ts and
      # the INTERNAL_API_KEY env var consumed by backend/src/middleware/auth.ts
      INTERNAL_API_KEY: test-internal-key
      # JWT signing (dummy — security tests use the x-internal-key bypass path)
      JWT_SECRET: ci-dummy-secret-do-not-use-in-production
      # Redis URL for ioredis client (matches the service port above)
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Push schema to MySQL 8
        working-directory: backend
        run: npm run db:push

      - name: Seed demo users required by security/config.ts
        working-directory: backend
        run: npx prisma db seed

      - name: TypeScript build
        working-directory: backend
        run: npm run build

      - name: Start backend in background
        working-directory: backend
        run: |
          nohup node dist/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend to be ready
        # Poll /api/health for up to 60 seconds. Fail fast if the server
        # crashed during startup (dump the log so we can diagnose).
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend failed to start within 60s"
          echo "--- backend.log ---"
          cat /tmp/backend.log || true
          exit 1

      - name: Run security test suite
        working-directory: backend
        # Phase F note: keep continue-on-error: true for the first 7 nightly
        # runs so we can establish which tests are reliably green before
        # tightening to a hard fail. The matrix test (Phase B) is excluded
        # because it already runs in-memory in the main `backend` CI job.
        continue-on-error: true
        run: npm test -- --testPathPattern=src/tests/security --testPathIgnorePatterns=rbac-matrix

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "--- backend.log ---"
          cat /tmp/backend.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          fi

      - name: Upload security reports (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: backend/security-reports/
          if-no-files-found: ignore
          retention-days: 14
