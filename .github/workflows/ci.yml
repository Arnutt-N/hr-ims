name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed to the same ref.
# Saves minutes and gives faster feedback on rapid iteration (e.g. PR #3).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Single MySQL dialect
#
# backend/prisma/schema.prisma uses provider = "mysql" for local MySQL 8 and
# production TiDB. There is no SQLite schema and no sqlite-to-mysql transform.
#
# Jobs that execute SQL (backend tests, e2e, lighthouse, mysql-schema) start
# a MySQL 8 service. Generate-only jobs (frontend lint, vercel build) do not
# connect; prisma generate only reads the schema file.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Frontend · lint + unit tests
  # Lightweight job for fast PR feedback. Does NOT run `next build` —
  # the full build lives in `vercel-build` so we avoid duplicate work.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · lint + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/next-app
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hrims
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-dummy-secret-do-not-use-in-production
      AUTH_SECRET: ci-dummy-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/next-app/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps matches what frontend's vercel:install does.
        # React 19 + some Radix packages still advertise older peer ranges.
        # The postinstall hook in frontend/next-app/package.json runs
        #   prisma generate --schema=../../backend/prisma/schema.prisma --generator client_frontend
        # automatically — no separate step needed here.
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests + coverage gate (Vitest)
        # `npm run test` invokes `vitest` which defaults to watch mode.
        # `--coverage` enforces the per-file thresholds set in vitest.config.ts
        # (lines: 70 etc. for the 12 priority lib/actions files). Drops in
        # coverage on those files break the build.
        run: npx vitest run --coverage

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/next-app/coverage/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Backend · tsc + Jest
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · typecheck + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrims
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      # Dev-only CI credentials. Matches docker-compose and backend/.env.example.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hrims
      JWT_SECRET: ci-dummy-secret-do-not-use-in-production
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (backend default generator)
        run: npm run prisma:generate

      - name: Push schema to MySQL 8
        run: npm run db:push

      - name: TypeScript build (tsc)
        run: npm run build

      - name: Unit & integration tests (Jest)
        # Security tests (src/tests/security/**) are E2E-style and require a
        # live Express server + Redis. They are designed to run separately via
        #   npm test -- --testPathPattern=security
        # against a running backend. Excluded here so CI runs only the fast
        # unit + integration suites. To add security tests to CI, create a
        # dedicated job with service containers (Redis) and a backend startup
        # step.
        run: npm test -- --testPathIgnorePatterns=src/tests/security

  # ---------------------------------------------------------------------------
  # Vercel-parity build
  # Mirrors EXACTLY what Vercel does when Vercel Project Settings has
  # Root Directory = frontend/next-app:
  #   1. cd frontend/next-app (the resolved Root Directory)
  #   2. Read frontend/next-app/vercel.json
  #   3. Verify framework detection: "next" must be in package.json deps
  #      (Vercel CLI checks this when framework: "nextjs" is set)
  #   4. Run installCommand from vercel.json (npm run vercel:install ->
  #      npm ci --legacy-peer-deps)
  #      - postinstall hook fires: prisma generate against backend schema
  #        via the client_frontend generator
  #   5. Run buildCommand from vercel.json (npm run vercel:build ->
  #      next build --webpack)
  #   6. Verify the outputDirectory from vercel.json exists. Default for
  #      Next.js would be .next, but next.config.mjs sets a custom
  #      distDir of .next-build for dev/prod isolation, so vercel.json
  #      must specify outputDirectory: ".next-build" to match.
  # ---------------------------------------------------------------------------
  vercel-build:
    name: Vercel · parity build (vercel.json)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/next-app
    env:
      # Prisma generate only reads the schema file — no DB connection is made
      # during postinstall or `next build`.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hrims
      # NextAuth v5 statically analyzes Route Handlers at build time and
      # requires these to be present. Dummy values are safe — nothing actually
      # signs or verifies tokens during `next build`.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-dummy-secret-do-not-use-in-production
      AUTH_SECRET: ci-dummy-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/next-app/package-lock.json

      - name: Verify Vercel framework detection would pass
        # When vercel.json has framework: "nextjs", Vercel CLI walks the
        # resolved Root Directory's package.json looking for "next" in
        # dependencies/devDependencies. If absent, Vercel errors with
        # "No Next.js version detected" before running any commands.
        run: |
          HAS_NEXT=$(node -p "Boolean(require('./package.json').dependencies?.next || require('./package.json').devDependencies?.next)")
          if [ "$HAS_NEXT" != "true" ]; then
            echo "::error::Vercel framework detection would FAIL — 'next' is not in frontend/next-app/package.json dependencies"
            exit 1
          fi
          NEXT_VERSION=$(node -p "require('./package.json').dependencies?.next || require('./package.json').devDependencies?.next")
          echo "Vercel framework detection: OK (next=$NEXT_VERSION)"

      - name: Read commands from frontend/next-app/vercel.json
        id: vercel
        run: |
          INSTALL=$(node -p "require('./vercel.json').installCommand")
          BUILD=$(node -p "require('./vercel.json').buildCommand")
          OUTPUT=$(node -p "require('./vercel.json').outputDirectory")
          echo "install=$INSTALL" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "vercel.json -> install: $INSTALL"
          echo "vercel.json -> build:   $BUILD"
          echo "vercel.json -> output:  $OUTPUT"

      - name: Run installCommand (from vercel.json)
        run: ${{ steps.vercel.outputs.install }}

      - name: Run buildCommand (from vercel.json)
        run: ${{ steps.vercel.outputs.build }}

      - name: Verify outputDirectory exists (from vercel.json)
        run: |
          if [ ! -d "${{ steps.vercel.outputs.output }}" ]; then
            echo "::error::Build did not produce outputDirectory '${{ steps.vercel.outputs.output }}'"
            exit 1
          fi
          echo "outputDirectory '${{ steps.vercel.outputs.output }}' exists"

  # ---------------------------------------------------------------------------
  # MySQL schema check
  # 1. prisma validate + generate against the single mysql schema
  # 2. migrate deploy the committed baseline onto MySQL 8
  # 3. fail if that database differs from schema.prisma
  # No production TiDB connection is made.
  # ---------------------------------------------------------------------------
  mysql-schema:
    name: MySQL 8 · schema validate + migrate
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrims
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hrims

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/next-app/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        # prisma generate writes the client_frontend output under
        # frontend/next-app/node_modules/.prisma/client.
        working-directory: frontend/next-app
        run: npm ci --legacy-peer-deps

      - name: Validate schema
        working-directory: backend
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Apply MySQL baseline migration
        working-directory: backend
        run: npm run db:migrate:deploy

      - name: Fail if migration SQL drifts from schema.prisma
        working-directory: backend
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  # ---------------------------------------------------------------------------
  # Phase D — E2E golden paths (Playwright)
  # Runs the 9 spec files under tests/e2e/golden/ against a freshly seeded
  # MySQL 8 database, with both `chromium` and `Mobile Chrome` Playwright projects.
  # Fails the build on the first non-flaky failure (retries: 2 in CI per
  # playwright.config.ts).
  # ---------------------------------------------------------------------------
  e2e-golden:
    name: E2E · golden paths (Playwright)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrims
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hrims
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-dummy-secret-do-not-use-in-production
      AUTH_SECRET: ci-dummy-secret-do-not-use-in-production
      INTERNAL_API_KEY: test-internal-key
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/next-app/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend/next-app
        run: npm ci --legacy-peer-deps

      - name: Push + seed Prisma schema
        working-directory: backend
        run: npm run db:setup

      - name: Install Playwright browsers (chromium only)
        working-directory: frontend/next-app
        run: npx playwright install --with-deps chromium

      - name: Run golden-path Playwright suite
        working-directory: frontend/next-app
        run: ./node_modules/.bin/playwright test tests/e2e/golden/

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/next-app/playwright-report/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Phase F — Lighthouse CI (PR-only)
  # Runs against `next start` (production build) on the four priority routes.
  # Budget: perf >= 80, a11y >= 95, best-practices >= 90 (see .lighthouserc.cjs).
  # Skipped on push-to-main to keep main-branch CI fast; PR builds catch
  # regressions before merge.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse · PR budgets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: vercel-build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrims
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hrims
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-dummy-secret-do-not-use-in-production
      AUTH_SECRET: ci-dummy-secret-do-not-use-in-production
      INTERNAL_API_KEY: test-internal-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/next-app/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend/next-app
        run: npm ci --legacy-peer-deps

      - name: Push + seed Prisma schema
        working-directory: backend
        run: npm run db:setup

      - name: Build Next.js
        working-directory: frontend/next-app
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        working-directory: frontend/next-app
        run: lhci autorun --config=.lighthouserc.cjs
